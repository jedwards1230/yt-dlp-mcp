version: "2"
run:
  go: "1.26"
  # Lint the live smoke test (gated with //go:build live so the default
  # `go test ./...` never touches the network) along with everything else.
  build-tags:
    - live
linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests read and write their own testdata and temp files.
      - path: _test\.go
        linters:
          - gosec
