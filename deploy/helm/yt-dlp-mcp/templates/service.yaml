apiVersion: v1
kind: Service
metadata:
  name: {{ include "yt-dlp-mcp.fullname" . }}
  labels:
    {{- include "yt-dlp-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "yt-dlp-mcp.selectorLabels" . | nindent 4 }}
