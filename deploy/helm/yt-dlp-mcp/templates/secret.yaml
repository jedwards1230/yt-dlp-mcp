{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yt-dlp-mcp.authSecretName" . }}
  labels:
    {{- include "yt-dlp-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
