name: CI
run-name: "CI — ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---------------------------------------------------------------
      # TODO: Add language setup and test/lint steps for your project.
      #
      # Go example:
      #   - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      #     with:
      #       go-version-file: go.mod
      #   - run: go test -v -race -coverprofile=coverage.out ./...
      #   - run: go vet ./...
      #   - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
      #
      # Node/Bun example:
      #   - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      #   - run: bun install
      #   - run: bun run lint
      #   - run: bun test
      #
      # Python example:
      #   - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      #     with:
      #       python-version: "3.12"
      #   - run: pip install -r requirements.txt
      #   - run: pytest
      # ---------------------------------------------------------------

      - name: Placeholder
        run: echo "TODO(template) — add test and lint steps"

  # Fails only in repos generated FROM this template (never in the template
  # itself) if any `TODO(template)` placeholder markers are still tracked —
  # see CONTRIBUTING.md, CLAUDE.md, docs/PRD.md, docs/TESTING.md.
  template-placeholders:
    name: Template placeholders
    if: github.repository != 'jedwards1230/template-repo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for unresolved template placeholders
        run: |
          # Excludes this workflow file, which references the marker literally
          # in order to define this check.
          if git grep -nF 'TODO(template)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Unresolved template placeholders (TODO(template)) found above — customize these before merging."
            exit 1
          fi
          echo "No unresolved template placeholders found."

  # Gate job: single required status check for branch protection
  ci:
    name: CI
    if: always()
    needs: [test, template-placeholders]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Test job failed"
            exit 1
          fi
          if [[ "${{ needs.template-placeholders.result }}" != "success" && "${{ needs.template-placeholders.result }}" != "skipped" ]]; then
            echo "::error::Template placeholder check failed"
            exit 1
          fi
          echo "All checks passed"
