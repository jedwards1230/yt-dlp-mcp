# PR review — calls the shared reusable workflow in
# jedwards1230/release-workflows, which runs claude-code-action@v1 in Haiku
# PR-review mode with the public jedwards1230-plugins marketplace + review-team
# plugin enabled by default. The focus below is appended to the base prompt.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.action != 'closed'
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review.yml@d9a5c9a683bdd1dfa6a8169252115e971f3053f4 # v1.10.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # preferred (subscription)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LITELLM_CI_KEY: ${{ secrets.LITELLM_CI_KEY }}
      LENS_TRACING_KEY: ${{ secrets.LENS_TRACING_KEY }}
    with:
      focus: |
        template-repo is a starter scaffold other repos are cloned from, so
        review for patterns that would propagate badly:
        - Insecure defaults, missing permissions scoping in shipped workflows,
          unpinned/outdated action versions.
        - Correctness of any scaffolded scripts, Dockerfile, or config.
        Keep it exemplary — flag anything a copier would inherit as a mistake.
        Do NOT re-flag formatting/lint that CI owns.

  cancel-review:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review-cancel.yml@9a48fc8ec1985081e7337e4ae6669a2753f847ef # v1
    with:
      review_workflow: ${{ github.workflow }}
