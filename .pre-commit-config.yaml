# Subtitle fixtures reproduce real-world files byte for byte (trailing spaces
# on blank caption lines, CRLF line endings), so whitespace fixers skip them.
exclude: ^internal/.*/testdata/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates are not plain YAML.
        exclude: ^deploy/helm/.*/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
